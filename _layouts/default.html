<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
  <meta property="og:image" content="{{ '/assets/headshot.jpg' | absolute_url }}">
</head>
<body>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a> ·
      <a href="https://github.com/amirtaherin">GitHub</a> ·
      <a href="https://scholar.google.com/citations?user=iodd_vQAAAAJ">Google Scholar</a> ·
      <a href="https://www.linkedin.com/in/amir-taherin-7a7a1a90/">LinkedIn</a> ·
      <a href="https://orcid.org/0000-0002-3646-0901">ORCID</a> ·
      <a href="https://www.webofscience.com/wos/author/record/POV-0097-2026">Web of Science</a> ·
      <a href="{{ '/uploads/AmirTaherin_CV.pdf' | relative_url }}">CV</a>
    </p>
    <p class="fine">© {{ site.time | date: '%Y' }} Amir Taherin</p>
  </footer>
</body>
</html>
